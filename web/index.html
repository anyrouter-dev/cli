<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>anyr — live WASM demo</title>
    <style>
      :root {
        --bg: #141414;
        --fg: #e1e1e1;
        --muted: #6c6c6c;
        --accent: #bb9af7;
        --ok: #9ece6a;
        --teal: #3a95ab;
        --border: #2c2c2c;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
        font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .wrap { min-height: 100%; display: flex; flex-direction: column; padding: 16px; gap: 12px; }
      header { color: var(--muted); }
      header strong { color: var(--accent); font-weight: 600; }
      #log { flex: 1; overflow: auto; white-space: pre-wrap; word-break: break-word;
        border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; min-height: 240px; }
      .prompt { color: var(--ok); }
      form { display: flex; gap: 8px; }
      input { flex: 1; background: #111; color: var(--fg); border: 1px solid var(--border);
        border-radius: 8px; padding: 10px 12px; font: inherit; outline: none; }
      input:focus { border-color: var(--accent); }
      button { background: var(--accent); color: #141414; border: 0; border-radius: 8px;
        padding: 10px 14px; font: inherit; font-weight: 600; cursor: pointer; }
      .hint { color: var(--muted); }
      a { color: var(--teal); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <strong>anyr</strong> live demo (WASM) · native install:
        <code>curl -fsSL https://anyrouter.dev/setup.sh | bash</code>
        · <span class="hint" id="ver"></span>
      </header>
      <div id="log" aria-live="polite"></div>
      <form id="f">
        <input id="cmd" autocomplete="off" spellcheck="false"
          placeholder="anyr --help    ·    anyr claude --dry-run --model auto" />
        <button type="submit">Run</button>
      </form>
      <div class="hint">
        Try <code>--help</code>, <code>login --help</code>,
        <code>claude --dry-run --key sk-ar-v1-demo</code>, <code>models</code>, <code>usage</code>.
        Device login and spawn need the
        <a href="https://github.com/anyrouter-dev/cli">native binary</a>.
      </div>
    </div>
    <script type="module">
      import init, { run_line, version } from "./pkg/anyr_cli.js";
      const log = document.getElementById("log");
      const input = document.getElementById("cmd");
      function print(text, cls) {
        const el = document.createElement("div");
        if (cls) el.className = cls;
        el.textContent = text;
        log.appendChild(el);
        log.scrollTop = log.scrollHeight;
      }
      await init();
      document.getElementById("ver").textContent = "v" + version();
      print("anyr " + version() + "  (wasm playground)");
      print("type a command and press Enter");
      document.getElementById("f").addEventListener("submit", (ev) => {
        ev.preventDefault();
        const line = input.value.trim() || "anyr --help";
        print("$ " + line, "prompt");
        print(run_line(line));
        input.value = "";
        input.focus();
      });
      input.focus();
    </script>
  </body>
</html>
