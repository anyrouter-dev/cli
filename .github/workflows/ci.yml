name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    name: test
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, llvm-tools-preview

      - name: cargo fmt --check (optional)
        run: cargo fmt --check
        continue-on-error: true

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: cargo llvm-cov (full suite)
        run: cargo llvm-cov --locked --all-targets --lcov --output-path lcov.info

      # Repo secret CODECOV_TOKEN from https://app.codecov.io/gh/anyrouter-dev/cli
      - uses: codecov/codecov-action@v5
        if: ${{ env.CODECOV_TOKEN != '' }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          flags: cli
          name: anyr-cli
          fail_ci_if_error: true
          verbose: true

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info

      - name: installer local-binary mode
        run: bash tests/setup-sh.test.sh

      - name: check co-author hook
        run: bash scripts/check-coauthors.sh

      - name: node wrapper syntax
        run: node --check scripts/npx-anyr.js

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: bench script syntax
        run: python -m py_compile scripts/bench.py scripts/release_notes.py scripts/stamp_beta_version.py

      - name: release notes
        run: python tests/release_notes_test.py

      - name: stamp beta version script
        run: python tests/stamp_beta_version_test.py

  build:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: anyr-linux-x86_64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            asset: anyr-linux-arm64
            target: aarch64-unknown-linux-gnu
          - os: macos-13
            asset: anyr-darwin-x86_64
            target: x86_64-apple-darwin
          - os: macos-latest
            asset: anyr-darwin-arm64
            target: aarch64-apple-darwin
          - os: windows-latest
            asset: anyr-windows-x86_64.exe
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: cargo test
        run: cargo test --locked --all-targets

      - name: stamp beta version (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python3 scripts/stamp_beta_version.py --run "${{ github.run_number }}"

      - name: cargo build --release
        run: cargo build --release --target ${{ matrix.target }}

      - name: package + strip
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/anyr"
          if [ -f "target/${{ matrix.target }}/release/anyr.exe" ]; then
            bin="target/${{ matrix.target }}/release/anyr.exe"
          fi
          strip "$bin" 2>/dev/null || true
          cp "$bin" "${{ matrix.asset }}"
          ls -la "${{ matrix.asset }}"

      - name: bench size and startup
        shell: bash
        run: |
          python scripts/bench.py measure \
            --bin "${{ matrix.asset }}" \
            --asset "${{ matrix.asset }}" \
            --target "${{ matrix.target }}" \
            --os "${{ matrix.os }}" \
            --kind native \
            --out "bench/${{ matrix.asset }}.json"

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            bench/${{ matrix.asset }}.json

  wasm:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: stamp beta version (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python3 scripts/stamp_beta_version.py --run "${{ github.run_number }}"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.100

      - name: cargo build wasm
        run: cargo build --release --target wasm32-unknown-unknown --no-default-features

      - name: wasm-bindgen
        run: |
          wasm-bindgen --target web --out-dir target/wasm-pkg \
            target/wasm32-unknown-unknown/release/anyr_cli.wasm
          ls -la target/wasm-pkg

      - name: bench wasm size
        run: |
          python scripts/bench.py measure \
            --bin target/wasm-pkg/anyr_cli_bg.wasm \
            --asset anyr.wasm \
            --target wasm32-unknown-unknown \
            --kind wasm \
            --out bench/anyr.wasm.json

      - uses: actions/upload-artifact@v4
        with:
          name: bench-anyr.wasm
          path: bench/anyr.wasm.json

  report:
    needs: [build, wasm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: compose markdown
        run: |
          python scripts/bench.py report artifacts --out bench-report.md --json-out bench-report.json
          cat bench-report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: bench-report
          path: |
            bench-report.md
            bench-report.json

      - name: comment on pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- anyr-bench-report -->';
            const body = marker + '\n' + fs.readFileSync('bench-report.md', 'utf8');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  beta:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: publish GitHub prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VER="$(python3 scripts/stamp_beta_version.py --run "${{ github.run_number }}" --print)"
          TAG="v${VER}"
          mkdir -p dist
          find artifacts -type f \( -name 'anyr-*' -o -name 'anyr.exe' \) ! -name '*.json' -exec cp -v {} dist/ \;
          ls -la dist
          test -n "$(ls -A dist)" || { echo "no binaries in artifacts"; exit 1; }
          SHORT="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          printf 'Beta from main (%s).\n\ncurl -fsSL https://anyrouter.dev/setup.sh | bash -s -- --channel beta\nchannel: beta\n' "$SHORT" > notes.md
          gh release create "${TAG}" dist/* \
            --prerelease \
            --target "${GITHUB_SHA}" \
            --title "${TAG}" \
            --notes-file notes.md
